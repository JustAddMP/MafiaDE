<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Co-op HUD</title>
<style>
  :root {
    --ink: #f3ead7;
    --dim: rgba(243, 234, 215, 0.62);
    --gold: #d9b35c;
    --red: #c8452f;
    --green: #7fb77e;
    --panel: rgba(12, 10, 8, 0.58);
    --edge: rgba(217, 179, 92, 0.35);
  }
  html, body { margin: 0; padding: 0; background: transparent; width: 100%; height: 100%; overflow: hidden; }
  body { font-family: Georgia, "Times New Roman", serif; color: var(--ink); pointer-events: none; }
  .hidden { display: none !important; }

  #objective {
    position: absolute; top: 290px; left: 48px; max-width: 520px;
    background: var(--panel); border-left: 3px solid var(--gold); padding: 12px 18px 12px 16px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.5);
  }
  #objective .kicker { font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); }
  #objective .text { font-size: 22px; margin-top: 4px; line-height: 1.2; }
  #objective .hint { font-size: 14px; color: var(--dim); margin-top: 4px; font-style: italic; }
  #objective .meta { font-size: 13px; color: var(--dim); margin-top: 8px; display: flex; gap: 18px; }
  #objective .meta b { color: var(--ink); font-weight: normal; }
  #timer { font-variant-numeric: tabular-nums; }
  #timer.low { color: var(--red); }

  #team {
    position: absolute; top: 56px; right: 48px; min-width: 220px;
    background: var(--panel); border-right: 3px solid var(--gold); padding: 10px 14px;
    font-size: 15px;
  }
  #team .kicker { font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  #team .row { display: flex; justify-content: space-between; gap: 14px; padding: 2px 0; }
  #team .row .name { white-space: nowrap; }
  #team .row .tag { color: var(--dim); font-size: 13px; }
  #team .row.down .name { color: var(--red); }
  #team .row.ready .name::after { content: " ✓"; color: var(--green); }
  #team .hp { height: 3px; background: rgba(255,255,255,0.15); margin-top: 2px; }
  #team .hp i { display: block; height: 100%; background: var(--green); }

  #waypoint {
    position: absolute; bottom: 72px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--edge); padding: 6px 16px; font-size: 18px;
    letter-spacing: 0.04em;
  }
  #waypoint small { color: var(--dim); font-size: 12px; margin-left: 8px; letter-spacing: 0.2em; text-transform: uppercase; }

  #banner {
    position: absolute; top: 24%; left: 50%; transform: translateX(-50%);
    text-align: center; opacity: 0; transition: opacity 0.35s ease;
  }
  #banner.show { opacity: 1; }
  #banner .big { font-size: 40px; letter-spacing: 0.18em; color: var(--gold); text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  #banner .sub { font-size: 18px; color: var(--ink); margin-top: 4px; text-shadow: 0 1px 6px rgba(0,0,0,0.8); }

  #lobby {
    position: absolute; bottom: 120px; left: 48px; max-width: 480px;
    background: var(--panel); border-left: 3px solid var(--gold); padding: 10px 16px; font-size: 14px; color: var(--dim);
  }
  #lobby b { color: var(--ink); font-weight: normal; }
  #lobby .k { color: var(--gold); }
</style>
</head>
<body>
  <div id="objective" class="hidden">
    <div class="kicker" id="missionName">MISSION</div>
    <div class="text" id="objText">Waiting for the crew</div>
    <div class="hint" id="objHint"></div>
    <div class="meta">
      <span>Objective <b id="stepNo">-</b></span>
      <span id="progressWrap" class="hidden"><b id="progress"></b></span>
      <span id="timerWrap" class="hidden">Time <b id="timer">0:00</b></span>
    </div>
  </div>

  <div id="team">
    <div class="kicker">Crew</div>
    <div id="teamRows"></div>
  </div>

  <div id="waypoint" class="hidden"><span id="wpDist">0 m</span><small id="wpLabel">to objective</small></div>

  <div id="banner"><div class="big" id="bannerBig"></div><div class="sub" id="bannerSub"></div></div>

  <div id="lobby">
    <div id="lobbyTitle"><b>Co-op story</b> &mdash; waiting in the lobby</div>
    <div id="lobbyKeys"><span class="k">F5</span> ready &nbsp; <span class="k">F6</span> start &nbsp; <span class="k">F7</span> hide HUD &nbsp; <span class="k">F9</span> disconnect &nbsp; <span class="k">/missions</span> list chapters</div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  let bannerTimer = null;
  let lastPhase = "lobby";

  function esc(s) { return String(s === undefined || s === null ? "" : s); }
  function fmtTime(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

  function showBanner(big, sub, ms) {
    $("bannerBig").textContent = esc(big);
    $("bannerSub").textContent = esc(sub);
    $("banner").classList.add("show");
    if (bannerTimer) clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => $("banner").classList.remove("show"), ms || 3500);
  }

  window.addEventListener("coop:visible", (e) => {
    document.body.style.display = e.detail && e.detail.visible === false ? "none" : "";
  });

  window.addEventListener("coop:title", (e) => showBanner(e.detail.title, e.detail.subtitle, 6000));
  window.addEventListener("coop:banner", (e) => showBanner(e.detail.title, e.detail.text, 3500));
  window.addEventListener("coop:missionEnd", (e) => showBanner(e.detail.title, e.detail.text, (e.detail.seconds || 5) * 1000));

  window.addEventListener("coop:objective", (e) => {
    $("objText").textContent = esc(e.detail.text);
    $("objHint").textContent = esc(e.detail.hint);
    $("objective").classList.remove("hidden");
  });

  window.addEventListener("coop:waypoint", (e) => {
    const d = e.detail || {};
    if (typeof d.distance === "number") {
      $("wpDist").textContent = d.distance >= 1000 ? (d.distance / 1000).toFixed(2) + " km" : d.distance + " m";
      $("waypoint").classList.remove("hidden");
    }
    if (d.label) $("wpLabel").textContent = esc(d.label);
  });

  window.addEventListener("coop:state", (e) => {
    const s = e.detail || {};
    const running = s.phase === "running";
    $("lobby").classList.toggle("hidden", running || s.phase === "ended");
    if (s.mode === "story") {
      $("lobbyTitle").innerHTML = "<b>Story mode</b> &mdash; " + (s.host ? esc(s.host) + " is playing the campaign, you ride along" : "waiting for the host");
      $("lobbyKeys").innerHTML = '<span class="k">/join</span> go to the host &nbsp; <span class="k">F4</span> panel &nbsp; <span class="k">F7</span> hide HUD &nbsp; <span class="k">F9</span> disconnect';
    } else {
      $("lobbyTitle").innerHTML = "<b>Co-op story</b> &mdash; waiting in the lobby";
      $("lobbyKeys").innerHTML = '<span class="k">F5</span> ready &nbsp; <span class="k">F6</span> start &nbsp; <span class="k">F7</span> hide HUD &nbsp; <span class="k">F9</span> disconnect &nbsp; <span class="k">/missions</span> list chapters';
    }
    if (!running) { $("waypoint").classList.add("hidden"); }
    if (s.phase === "lobby" && lastPhase !== "lobby") { $("objective").classList.add("hidden"); }
    lastPhase = s.phase;

    if (s.mission) $("missionName").textContent = "CHAPTER " + s.mission.index + " — " + esc(s.mission.title);
    if (s.step) {
      $("stepNo").textContent = s.step.index + "/" + s.step.total;
      if (s.step.objective) $("objText").textContent = esc(s.step.objective);
      $("objHint").textContent = esc(s.step.hint);
      $("progressWrap").classList.toggle("hidden", !s.step.progress);
      $("progress").textContent = esc(s.step.progress);
      $("objective").classList.remove("hidden");
    }
    const hasTimer = typeof s.timer === "number";
    $("timerWrap").classList.toggle("hidden", !hasTimer);
    if (hasTimer) { $("timer").textContent = fmtTime(s.timer); $("timer").classList.toggle("low", s.timer <= 30); }

    const rows = $("teamRows");
    rows.innerHTML = "";
    for (const p of (s.team || [])) {
      const row = document.createElement("div");
      row.className = "row" + (p.down ? " down" : "") + (p.ready && !running ? " ready" : "");
      const name = document.createElement("span"); name.className = "name"; name.textContent = esc(p.name);
      const tag = document.createElement("span"); tag.className = "tag";
      tag.textContent = p.down ? "down" : (p.vehicle ? esc(p.vehicle) : (running ? "on foot" : (p.ready ? "ready" : "not ready")));
      row.appendChild(name); row.appendChild(tag);
      rows.appendChild(row);
      const hp = document.createElement("div"); hp.className = "hp";
      const bar = document.createElement("i"); bar.style.width = Math.max(0, Math.min(100, p.health || 0)) + "%";
      hp.appendChild(bar); rows.appendChild(hp);
    }
  });
</script>
</body>
</html>
